upstream dev_backend {
    server 127.0.0.1:8010;
}

server {
    listen 80;
    server_name dev.uri-bokji.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dev.uri-bokji.com;

    ssl_certificate /etc/letsencrypt/live/uri-bokji.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uri-bokji.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/dev/admin;
    index index.html;

    location /api {
        proxy_pass http://dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
